[project]
name = "claimlens"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5,<3.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]